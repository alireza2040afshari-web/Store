{% load static %}
    <link rel="stylesheet" href="{% static 'store/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
 
<section class="products" id="products">
    <h2>Our Products</h2>

    <div class="product-list">

        {% for product in products %}

            <div class="product">
                {% if product.poster %}
                     <img src="{{ product.poster.url }}" alt="{{ product.name }}" width="200">
                {% endif %}

                <h3>product : {{ product.name }}</h3>

                <p>brand : {{ product.factory }}</p>

                <p>origin : {{ product.origin }}</p>

                <p>describtions : {{ product.description }}</p>
            </div>

        {% empty %}

            <p class="warning">No products available.</p>

        {% endfor %}

    </div>
</section>

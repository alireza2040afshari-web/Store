<section class="products" id="products">
    <h2>Our Products</h2>

    <div class="product-list">

        {% for product in products %}

            <div class="product">

                <h3>{{ product.name }}</h3>

                <p>{{ product.factory }}</p>

                <p>{{ product.origin }}</p>

                <p>{{ product.description }}</p>

                {% if product.poster %}
                    <img src="{{ product.poster.url }}"
                         alt="{{ product.name }}"
                         width="200">
                {% endif %}

            </div>

        {% empty %}

            <p>No products available.</p>

        {% endfor %}

    </div>
</section>
